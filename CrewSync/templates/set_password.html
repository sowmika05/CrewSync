<!DOCTYPE html>
<html>
<head>
    <title>Set Password</title>
</head>


<body>


<h2>Create Your Password</h2>


<form method="POST">


    {% csrf_token %}


    <label>Password</label>
    <input type="password" name="password" required>


    <br><br>


    <label>Confirm Password</label>
    <input type="password" name="confirm_password" required>


    <br><br>


    <button type="submit">
        Create Password
    </button>


</form>


</body>
</html>
